﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义拖动排序的面板卡片列表</title>
    <style>
        /* 强制显示垂直滚动条，并确保html和body占据整个视窗高度 */
        html, body {
            height: 100%; /* 占据整个视窗高度 */
            margin: 0;
            overflow: hidden; /* 防止页面整体滚动 */
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 20px;
            padding-top: 50px;
            align-items: center;
        }

        /* 工作区管理头部样式 */
        .workspace-header {
            width: 100%;
            max-width: 1600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .workspace-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .workspace-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .workspace-actions {
            display: flex;
            gap: 10px;
        }

        .workspace-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .workspace-btn:hover {
            background-color: #0056b3;
        }

        .workspace-btn.delete {
            background-color: #dc3545;
        }

        .workspace-btn.delete:hover {
            background-color: #c82333;
        }

        /* 新增：有序模式切换按钮样式 */
        .order-mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 20px;
            padding: 8px 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .order-mode-toggle:hover {
            background-color: #e9ecef;
        }

        .order-mode-toggle.active {
            background-color: #e7f3ff;
            border-color: #007bff;
        }

        .order-mode-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #6c757d;
        }

        .order-mode-toggle.active .order-mode-indicator {
            background-color: #007bff;
        }

        .order-mode-text {
            font-size: 14px;
            color: #495057;
        }

        .main-container {
            display: flex;
            gap: 30px;
            /* 关键：拉伸对齐，确保所有模块高度一致 */
            align-items: stretch;
            /* 强制不换行 */
            flex-wrap: nowrap;
            width: 100%;
            max-width: 1600px;
            /* 减去头部高度，确保刚好占满屏幕 */
            height: calc(100vh - 140px);
            box-sizing: border-box;
        }

        .panel, .archive-module, .details-panel {
            --panel-bg-color: #ffffff;
            background-color: var(--panel-bg-color);
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            /* 这里的 padding 设为 0，具体内边距交给各自的内部样式控制 */
            padding: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            
            /* =========== 核心修改开始 =========== */
            /* 1. 均分宽度：所有模块默认为 1 份 */
            flex: 1; 
            
            /* 2. 修复 Bug 的关键：允许容器压缩到比内容更小 */
            /* 如果没有这行，富文本的长文字会强行撑大容器 */
            min-width: 0;
            
            /* 3. 确保高度填满 */
            height: 100%;
            
            /* 4. 宽度过渡动画 */
            transition: flex 0.3s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s ease;
            /* =========== 核心修改结束 =========== */
        }

        /* 详细信息面板 */
        .details-panel {
            /* 移除之前所有的 max-width, min-width 设置 */
            /* 恢复内边距 */
            padding: 30px;
            overflow-y: hidden; /* 外部不滚动，内部滚动 */
        }

        /* --- 核心修改：详细信息模块容器样式 --- */
        .details-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px; /* 间距减少 */
            overflow-y: auto;
        }

        /* 详细信息内容模块的包装器 */
        .details-content-wrapper {
            /* --- 核心修改：卡片风格应用到这个容器 --- */
            background-color: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            overflow-y: auto;
        }
            /* --- 鼠标悬停时添加描边 --- */
            .details-content-wrapper:hover {
                border-color: #87ceeb;
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            }

        /* 详细信息模块的主标题 */
        .details-panel > h1 {
            color: #2c3e50;
            text-align: center;
            margin: 0; /* 上下外边距都为0 */
        }
        /* --- 额外优化: details-title-wrapper 也左对齐，保证一致性 --- */
        .details-title-wrapper {
            text-align: left; /* 保持左对齐 */
            margin: 0;
            padding: 0;
        }
        /* --- 单独设置标签的尺寸间距为0 --- */
        #details-title {
            font-size: 1.6em;
            text-align: left;
            margin: 0;
        }
        /* 待执行模块：固定高度可滚动 */
        .panel {
            /* 移除之前所有的 width: 50% 设置 */
            padding: 30px;
            overflow-y: auto;
        }

/* 已归档模块 */
        .archive-module {
            /* 移除之前所有的 max-width, width 设置 */
            overflow: hidden;
            /* 确保背景色存在，防止收起时变透明 */
            background-color: #fff;
        }

/* 新增：归档模块收起状态 - 变为固定侧边栏 */
/* 归档模块收起状态 */
        .archive-module.collapsed {
            flex: 0 0 60px;
            width: 60px;
            min-width: 60px;
            /* 确保背景和阴影不丢失 */
            background-color: #ffffff;
        }

            /* 收起时隐藏卡片列表内容 */
            .archive-module.collapsed .archive-content {
                display: none;
            }
            
            /* 收起时调整头部布局：让箭头和文字竖着排 */
            .archive-module.collapsed .archive-header {
                padding: 15px 0;
                display: flex;
                flex-direction: column; /* 纵向排列：先箭头，后文字 */
                align-items: center;    /* 水平居中 */
                justify-content: flex-start;
                gap: 15px;              /* 箭头和文字之间的距离 */
                border-bottom: none;
                height: 100%;           /* 占据全高 */
            }
            
            /* 收起时文字变为竖排的关键修正 */
            .archive-module.collapsed .archive-header h2 {
                display: block; 
                writing-mode: vertical-lr; /* 竖向文本流 */
                text-orientation: upright; /* 汉字保持正立 */
                
                /* 1. 字体大小强制同步：使用和展开时一样的 1.2em，并加 bold 确保视觉重量 */
                font-size: 1.2em; 
                font-weight: bold;
                
                /* 2. 核心修正：解决“间距大”的问题 */
                /* 在竖排模式下，line-height 会变成字与字之间的左右间距，
                   而我们需要的是垂直方向的紧凑，所以设置 line-height 为 1 */
                line-height: 1; 
                
                /* 3. 核心修正：设置字间距为 0，确保和水平时一样紧凑 */
                letter-spacing: 0px; 
                
                /* 4. 消除所有可能导致缩小的内边距/外边距 */
                margin: 0;
                padding: 0;
                white-space: nowrap;
                color: #2c3e50;
            }
            
            /* 收起时箭头的样式 */
            .archive-module.collapsed .archive-header .archive-toggle-button {
                display: block !important;
                transform: rotate(-90deg); /* 让原本向下的箭头指向右侧 */
                font-size: 1.2em;
                margin: 0;
            }
        /* --- 结束核心修改 --- */


        .panel h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* --- 新增：统计区域样式 --- */
        .stats-panel {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }

        .stats-header {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .progress {
            height: 100%;
            background-color: #4CAF50;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .stats-text {
            font-size: 0.9em;
            color: #666;
            text-align: center;
        }

        .add-card-button {
            background-color: #f9f9f9;
            border: 2px dashed #ccc;
            border-radius: 6px;
            padding: 15px 20px;
            box-sizing: border-box;
            text-align: center;
            color: #999;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 20px;
            transition: border-color 0.2s ease-in-out, background-color 0.2s ease-in-out;
            flex-shrink: 0; /* 防止被压缩 */
        }

            .add-card-button:hover {
                border-color: #007bff;
                background-color: #e6f7ff;
                color: #007bff;
            }

            .add-card-button span {
                line-height: 1;
            }

        .card-list {
            display: flex;
            flex-direction: column;
            min-height: 100px;
            position: relative;
            flex-grow: 1;
        }

        .card {
            background-color: #f9f9f9;
            border-radius: 10px;
            border-bottom-left-radius: 10px;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 2px solid #ddd;
            border-left: none;
            transition: box-shadow 0.2s ease-in-out, transform 0.2s ease-out, border-color 0.2s ease-in-out;
            cursor: grab;
            z-index: 1;
            margin-bottom: 15px;
            display: flex;
            align-items: stretch;
            position: relative;
            overflow: hidden;
            flex-shrink: 0; /* 防止卡片在滚动区域被压缩 */
        }

            .card:last-child {
                margin-bottom: 0;
            }
            /* 鼠标悬停时的描边颜色 */
            .card:hover {
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
                border-color: #87ceeb; /* 淡蓝色 */
                border-left-color: #87ceeb; /* 悬停时左侧边框也显示蓝色 */
            }

            /* 选中时的描边样式 */
            .card.selected {
                border-color: #007bff;
                box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2);
                border-left-color: #007bff; /* 选中时左侧边框也显示蓝色 */
            }

            /* 拖拽中的卡片样式 */
            .card.is-dragging {
                position: fixed;
                top: var(--drag-start-y);
                left: var(--drag-start-x);
                transform: translate(var(--x, 0), var(--y, 0));
                cursor: grabbing;
                box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
                z-index: 1000;
                width: var(--drag-width);
                height: var(--drag-height);
            }

        /* 拖拽占位符样式 */
        .placeholder {
            background-color: #e0e0e0;
            border: 2px dashed #999;
            border-radius: 6px;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: stretch;
            justify-content: center;
            color: #777;
            font-size: 1em;
            margin-bottom: 15px;
            /* --- 核心修改：移除 height: 100px; 启用自动高度 --- */
            /* 占位符高度应与被拖动的卡片一致，由JS设置 */
        }

            /* 占位符内部内容区域 */
            .placeholder .card-content {
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 15px 20px;
            }

        .card-list .placeholder:last-child {
            margin-bottom: 0;
        }

        /* --- 新增：还原占位符样式 --- */
        .restore-placeholder {
            border: 2px dashed #a8caff;
            background-color: #eaf5ff;
            color: #007bff;
        }

            .restore-placeholder .card-content {
                color: #007bff;
                background-color: #eaf5ff;
            }

        /* 编辑模式下 input/textarea 的样式 */
        .card h2,
        .card textarea {
            flex-grow: 1;
            font-weight: bold;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        /* 详细信息面板标题的编辑样式 */
        .details-panel h1,
        .details-panel textarea {
            font-size: 1.6em;
            font-weight: bold;
            text-align: left;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            border: none;
            background-color: transparent;
            outline: none;
            resize: none;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            color: inherit;
        }


        .card textarea {
            border: none;
            outline: none;
            background-color: transparent;
            resize: none;
            height: auto;
            min-height: 30px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            color: inherit;
            overflow-y: hidden;
        }

        /* 为h2添加溢出省略样式 */
        .card h2 {
            display: -webkit-box;
            -webkit-line-clamp: 2; /* 限制2行 */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- 修改：卡片左侧标签头样式 --- */
        .card-tag {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 10px; /* 增加宽度 */
            background-color: #ff9800;
            /* 调整圆角，只保留左上角圆角 */
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
            cursor: pointer;
            z-index: 2;
        }

        /* 卡片内容区域的容器 */
        .card-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* --- 修改: 左对齐 --- */
            /* --- 调整上下内边距 --- */
            padding: 5px 20px; /* --- 核心修改: 上下为5px, 左右为20px --- */
            background-color: #f9f9f9;
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        /* --- 新增：删除按钮样式 --- */
        .delete-button {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            background-color: rgba(128, 128, 128, 0.3);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease-in-out, background-color 0.2s ease-in-out;
            z-index: 10;
            line-height: 1;
            padding: 0;
        }
        /* 鼠标悬停在卡片上时显示删除按钮 */
        .card:hover .delete-button {
            opacity: 1;
        }

        .delete-button:hover {
            background-color: rgba(255, 0, 0, 0.6);
        }

        /* 归档模块样式 */
        .archive-module {
            width: 50%;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            padding: 0;
            display: flex;
            flex-direction: column;
            /* --- 核心修改：移除 height: auto; 和 overflow: hidden; --- */
            /* 样式已合并到 .archive-module 的 max-height 和 transition 中 */
        }

        .archive-header {
            display: flex;
            /* --- 核心修改：将内容居中，并确保垂直对齐 --- */
            justify-content: center;
            align-items: center; /* 确保垂直居中 */
            color: #2c3e50;
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            box-sizing: border-box;
            flex-shrink: 0; /* 防止被压缩 */
        }
            /* --- 核心修改：移除 h2 的下边距，保证垂直居中 --- */
            .archive-header h2 {
                margin: 0;
                font-size: 1.2em;
            }

        .archive-toggle-button {
            /* --- 核心修改：直接移除这个按钮的样式，让它不显示 --- */
            display: none;
        }

        /* 展开时旋转箭头 */
        .archive-module:not(.collapsed) .archive-toggle-button {
            transform: rotate(180deg);
        }

        /* --- 修改: 归档内容区域的 CSS --- */
        .archive-content {
            /* 默认收起状态 */
            max-height: 0;
            overflow-y: auto;
            padding: 0 20px;
            opacity: 0;
            pointer-events: none;
            transition: max-height 0.5s cubic-bezier(0.25, 1, 0.5, 1), padding 0.5s, opacity 0.5s;
        }

        .archive-module:not(.collapsed) .archive-content {
            /* 展开状态 */
            max-height: 2000px; /* 足够大的值，确保能显示所有内容 */
            padding-top: 15px;
            padding-bottom: 15px;
            opacity: 1;
            pointer-events: auto;
        }
        /* --- 结束修改 --- */

        /* --- 核心修改：归档卡片的样式，与主列表卡片保持一致 --- */
        .archive-content .card {
            background-color: #f9f9f9; /* 与主列表一致的背景色 */
            border: 2px solid #ddd;
            border-left: none;
            pointer-events: auto;
            cursor: pointer; /* 归档卡片现在可以点击选中 */
            opacity: 0.7; /* 归档卡片略微透明 */
            margin-bottom: 15px; /* 与主列表卡片保持一致的边距 */
            display: flex;
            align-items: stretch;
            padding: 0;
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            border-radius: 10px; /* 保持圆角 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* 保持阴影 */
        }

            .archive-content .card:hover {
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
                border-color: #87ceeb;
                border-left-color: #87ceeb;
            }

            .archive-content .card:last-child {
                margin-bottom: 0;
            }

            /* --- 新增：归档卡片选中时的样式 --- */
            .archive-content .card.selected {
                border-color: #007bff; /* 蓝色描边 */
                box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2); /* 蓝色阴影 */
                border-left-color: #007bff; /* 左侧边框也为蓝色 */
                opacity: 1; /* 选中时完全不透明 */
            }
            /* --- 结束新增 --- */

            .archive-content .card .card-content {
                background-color: #f9f9f9; /* 与主列表一致的背景色 */
                padding: 5px 20px; /* 与主列表一致的内边距 */
                flex-direction: column; /* 保持垂直排列 */
                justify-content: center;
                align-items: flex-start;
            }

            .archive-content .card .card-tag {
                background-color: #888;
            }
            /* --- 核心修改：归档卡片内容区域的布局恢复到与主列表一致 --- */
            .archive-content .card .card-content-wrapper {
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
            }
            /* --- 核心修改：归档卡片内部文字样式保持与主列表一致 --- */
            .archive-content .card .card-title {
                font-size: 1em;
                font-weight: bold;
                text-align: left;
                margin-top: 0;
                margin-bottom: 5px;
            }

            .archive-content .card .card-summary {
                font-size: 0.9em;
                color: #888;
                text-align: left;
                margin-top: 0;
                margin-bottom: 5px;
            }

            .archive-content .card .card-type {
                font-size: 0.7em;
                color: #888;
                font-weight: normal;
                margin-top: 0;
                margin-bottom: 0;
                display: none; /* 归档卡片不显示类型 */
            }

                .editor-toolbar button.format-button {

</head>
<body>
    <!-- 新增工作区管理头部 -->
    <div class="workspace-header">
        <div class="workspace-selector">
            <label for="workspace-select">工作区:</label>
            <select id="workspace-select" class="workspace-select">
                <!-- 工作区选项将通过JavaScript动态生成 -->
            </select>
            <!-- 新增：有序模式切换按钮 -->
            <div id="order-mode-toggle" class="order-mode-toggle">

    <div class="main-container">
        <div class="archive-module">

            <div class="archive-content">

        </div>

        <div class="panel">
            <!-- 新增：统计区域 -->
            <div class="stats-panel">
                <div class="stats-header">完成进度：<span id="completed-percent">0%</span></div>
                <div class="progress-bar">
                    <div class="progress" id="progress-bar-fill"></div>
                </div>
                <div class="stats-text">总事项：<span id="total-count">0</span> | 已完成：<span id="completed-count">0</span> | 未完成：<span id="uncompleted-count">0</span></div>
            </div>
            
            <div class="add-card-button">
                <span>+</span>
            </div>

            </div>
        </div>

        <div class="details-panel">
            <div class="details-container">
                <div class="details-content-wrapper">
                    <div class="details-title-wrapper">
                        <h2 id="details-title"></h2>
                    </div>
                    <!-- 新增富文本编辑工具栏 -->
                    <div class="editor-toolbar" id="editor-toolbar">
                        <button class="format-button" data-command="bold"><b>B</b></button>
                        <button class="format-button" data-command="italic"><i>I</i></button>
                        <button class="format-button" data-command="underline"><u>U</u></button>
                        <button class="format-button" data-command="insertUnorderedList">UL</button>

                    </div>

                <button id="delete-btn">删除</button>

<script>
    // 工作区管理相关变量
    let workspaces = {};
    let currentWorkspaceId = null;
    const workspaceSelect = document.getElementById('workspace-select');
    const createWorkspaceBtn = document.getElementById('create-workspace-btn');
    const renameWorkspaceBtn = document.getElementById('rename-workspace-btn');
    const deleteWorkspaceBtn = document.getElementById('delete-workspace-btn');
    const orderModeToggle = document.getElementById('order-mode-toggle'); // 新增：有序模式切换按钮

    // 原有变量保持不变
    const cardList = document.querySelector('.card-list');
    const addCardButton = document.querySelector('.add-card-button');
    const archiveModule = document.querySelector('.archive-module');
    const archiveContent = document.querySelector('.archive-content');
    const detailsTitle = document.getElementById('details-title');
    const detailsContent = document.getElementById('details-content-main');
    const completeButton = document.getElementById('complete-btn');
    const deleteButton = document.getElementById('delete-btn');
    const editorToolbar = document.getElementById('editor-toolbar'); // 新增：获取工具栏元素

    // 新增：统计区域元素
    const completedPercentElement = document.getElementById('completed-percent');
    const totalCountElement = document.getElementById('total-count');
    const completedCountElement = document.getElementById('completed-count');
    const uncompletedCountElement = document.getElementById('uncompleted-count');
    const progressBarFill = document.getElementById('progress-bar-fill');

    let draggedItem = null;
    let placeholder = null; // 用于拖拽的占位符
    let restorePlaceholder = null; // 用于还原的占位符
    let initialMouseX = 0;
    let initialMouseY = 0;
    let isDragging = false;
    let originalNextSibling = null;
    let originalItemRect = null;
    let currentPlaceholderIndex = -1;
    let selectedCard = null; // 存储当前选中的卡片
    let isEditing = false; // 用于卡片内容编辑状态 (现在也用于标题编辑)
    let isColorPicking = false; // 用于颜色选择状态

    const TITLE_MAX_LENGTH = 50; // 定义标题最大长度
    const SUMMARY_MAX_LENGTH = 80; // 定义摘要最大长度

    // ==================== 调试通信机制 ====================
    const DEBUG_TOOL_NAME = 'tododragboard';
    let currentCommandId = null;

    async function pollDebugCommand() {
        try {
            const response = await fetch(`/debug_comm/poll?tool=${DEBUG_TOOL_NAME}`);
            const data = await response.json();
            
            if (data.command) {
                currentCommandId = data.command_id;
                console.log('[调试通信] 收到命令:', data.command);
                
                try {
                    const result = eval(data.command);
                    console.log('[调试通信] 执行结果:', result);
                    
                    await submitDebugResult(result);
                } catch (e) {
                    console.error('[调试通信] 执行错误:', e);
                    await submitDebugResult(e.toString(), 'error');
                }
            }
        } catch (e) {
            console.error('[调试通信] 轮询错误:', e);
        }
    }

    async function submitDebugResult(result, level = 'info') {
        try {
            const payload = {
                tool: DEBUG_TOOL_NAME,
                result: result,
                logs: [{ level: level, message: `执行完成: ${result}` }],
                command_id: currentCommandId
            };
            await fetch('/debug_comm/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (e) {
            console.error('[调试通信] 提交结果错误:', e);
        }
    }

    setInterval(pollDebugCommand, 500);

    // ==================== API 函数 ====================

    // 从服务器加载数据
    async function loadFromServer() {
        try {
            const payload = {
                filename: 'taskWorkspacesData'
            };

            const response = await fetch('api/json/r', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const data = await response.json();
            return data;
        } catch (error) {
            if (error.message.includes('404') || error.message.includes('400')) {
                return null;
            }
            throw error;
        }
    }

    // 保存数据到服务器
    async function saveToServer(data) {
        try {
            const payload = {
                filename: 'taskWorkspacesData',
                data: data
            };

            const response = await fetch('api/json/w', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const result = await response.json();
            console.log('--- saveToServer: 数据保存成功 ---', result);
            return result;
        } catch (error) {
            console.error('--- saveToServer: 保存数据到服务器失败 ---', error);
            throw error;
        }
    }

    // 页面加载完成后立即确保分隔线存在且位置正确
    document.addEventListener('DOMContentLoaded', () => {
        // 在DOMContentLoaded之后，获取panel的背景色并设置CSS变量
        const panel = document.querySelector('.panel');
        if (panel) {
            const panelBgColor = window.getComputedStyle(panel).backgroundColor;
            document.documentElement.style.setProperty('--panel-bg-color', panelBgColor);
        }
        
        // 初始化工作区系统
        initWorkspaceSystem();
        
        // 页面加载后自动选中第一个卡片
        // 延迟选中，确保卡片元素已经创建并渲染
        setTimeout(() => {
            const firstCard = cardList.querySelector('.card');
            if (firstCard) {
                selectCard(firstCard);
            }
        }, 100); // 100ms 延迟，确保 DOM 更新完成
    });

    // ==================== 工作区管理功能 ====================

    // 初始化工作区系统
    function initWorkspaceSystem() {
        // 绑定工作区按钮事件
        createWorkspaceBtn.addEventListener('click', createWorkspace);
        renameWorkspaceBtn.addEventListener('click', renameCurrentWorkspace);
        deleteWorkspaceBtn.addEventListener('click', deleteCurrentWorkspace);
        workspaceSelect.addEventListener('change', switchWorkspace);
        
        // 新增：绑定有序模式切换事件
        orderModeToggle.addEventListener('click', toggleOrderMode);
        
        // 新增：启动定时自动保存（每10秒保存一次）
        startAutoSave();
        
        // 加载工作区数据
        loadWorkspaceData();
    }

    // 新增：定时自动保存功能
    function startAutoSave() {
        // 每10秒自动保存一次
        setInterval(async () => {
            // 只有在有当前工作区时才保存
            if (currentWorkspaceId && workspaces[currentWorkspaceId]) {
                console.log('--- 定时自动保存 ---');
                await saveWorkspaceData();
            }
        }, 2000); // 10秒
    }

    // 新增：切换有序模式
    function toggleOrderMode() {
        if (!currentWorkspaceId) return;
        
        const currentWorkspace = workspaces[currentWorkspaceId];
        currentWorkspace.isOrdered = !currentWorkspace.isOrdered;
        
        // 更新UI状态
        updateOrderModeUI();
        
        // 保存工作区数据
        saveWorkspaceData();
    }

    // 新增：更新有序模式UI
    function updateOrderModeUI() {
        if (!currentWorkspaceId) return;
        
        const currentWorkspace = workspaces[currentWorkspaceId];
        
        if (currentWorkspace.isOrdered) {
            orderModeToggle.classList.add('active');
            orderModeToggle.setAttribute('title', '有序模式已开启：只有第一个任务可以完成');
        } else {
            orderModeToggle.classList.remove('active');
            orderModeToggle.setAttribute('title', '有序模式已关闭：任何任务都可以完成');
        }
    }

    // 创建工作区
    async function createWorkspace() {
        const workspaceName = prompt('请输入新工作区的名称:', `工作区 ${Object.keys(workspaces).length + 1}`);
        if (!workspaceName) return;
        
        const workspaceId = 'workspace-' + Date.now();
        const newWorkspace = {
            id: workspaceId,
            name: workspaceName,
            createdAt: new Date().toISOString(),
            lastActive: new Date().toISOString(),
            cards: [],
            archiveModuleCollapsed: true,
            isOrdered: true // 新增：默认有序模式
        };
        
        workspaces[workspaceId] = newWorkspace;
        
        // 更新工作区选择器
        updateWorkspaceSelector();
        
        // 切换到新工作区
        switchWorkspaceById(workspaceId);
        
        // 保存工作区数据
        await saveWorkspaceData();
    }

    // 重命名当前工作区
    async function renameCurrentWorkspace() {
        if (!currentWorkspaceId) return;
        
        const currentWorkspace = workspaces[currentWorkspaceId];
        const newName = prompt('请输入新的工作区名称:', currentWorkspace.name);
        
        if (newName && newName.trim() !== '') {
            currentWorkspace.name = newName.trim();
            updateWorkspaceSelector();
            await saveWorkspaceData();
        }
    }

    // 删除当前工作区
    async function deleteCurrentWorkspace() {
        if (!currentWorkspaceId) return;
        
        // 不能删除最后一个工作区
        if (Object.keys(workspaces).length <= 1) {
            alert('不能删除最后一个工作区！');
            return;
        }
        
        if (confirm(`确定要删除工作区 "${workspaces[currentWorkspaceId].name}" 吗？此操作无法撤销。`)) {
            // 先保存要被删除的工作区ID
            const workspaceToDeleteId = currentWorkspaceId;
            const workspaceToDeleteName = workspaces[currentWorkspaceId].name;
            
            // 清理 localStorage 中该工作区的选中卡片信息
            localStorage.removeItem(`selectedCard_${workspaceToDeleteId}`);
            
            // 先切换到另一个工作区（在删除之前）
            const remainingWorkspaceIds = Object.keys(workspaces).filter(id => id !== workspaceToDeleteId);
            if (remainingWorkspaceIds.length > 0) {
                // 直接设置当前工作区ID，不通过 switchWorkspaceById 避免保存状态
                currentWorkspaceId = remainingWorkspaceIds[0];
                workspaces[currentWorkspaceId].lastActive = new Date().toISOString();
                
                // 更新工作区选择器
                updateWorkspaceSelector();
                
                // 加载新工作区状态
                loadCurrentWorkspaceState();
            }
            
            // 现在安全地删除工作区
            delete workspaces[workspaceToDeleteId];
            
            // 保存工作区数据
            await saveWorkspaceData();
            
            console.log(`工作区 "${workspaceToDeleteName}" 已删除`);

            location.reload();
        }
    }

    // 通过ID切换工作区
    async function switchWorkspaceById(workspaceId) {
        if (!workspaces[workspaceId]) return;
        
        // 保存当前工作区状态
        if (currentWorkspaceId) {
            await saveCurrentWorkspaceState();
        }
        
        // 切换到新工作区
        currentWorkspaceId = workspaceId;
        workspaces[workspaceId].lastActive = new Date().toISOString();
        
        // 更新工作区选择器
        updateWorkspaceSelector();
        
        // 加载工作区数据
        loadCurrentWorkspaceState();
        
        // 保存工作区数据
        await saveWorkspaceData();
    }

    // 切换工作区（事件处理）
    async function switchWorkspace() {
        const selectedWorkspaceId = workspaceSelect.value;
        if (selectedWorkspaceId && selectedWorkspaceId !== currentWorkspaceId) {
            await switchWorkspaceById(selectedWorkspaceId);
        }
    }

    // 保存当前工作区状态
    function saveCurrentWorkspaceState() {
        if (!currentWorkspaceId) return;
        
        const currentWorkspace = workspaces[currentWorkspaceId];
        
        // 保存卡片数据
        currentWorkspace.cards = _collectCurrentCardsData();
        
        // 保存归档模块状态
        currentWorkspace.archiveModuleCollapsed = archiveModule.classList.contains('collapsed');

    // 加载当前工作区状态
    function loadCurrentWorkspaceState() {
        if (!currentWorkspaceId) return;
        
        const currentWorkspace = workspaces[currentWorkspaceId];
        
        // 清空现有卡片
        document.querySelectorAll('.card-list .card, .archive-content .card, .card-list .card-divider').forEach(el => el.remove());
        selectedCard = null;
        
        // 加载卡片数据
        if (currentWorkspace.cards && currentWorkspace.cards.length > 0) {
            currentWorkspace.cards.forEach(cardData => {
                createNewCard(cardData.content, cardData.details, cardData.tagColor, cardData.isArchived, cardData.originalTagColor);
            });
        } else {
            // 如果工作区没有卡片，创建默认卡片
            createDefaultCardsForWorkspace();
        }
        
        // 恢复归档模块状态
        if (currentWorkspace.archiveModuleCollapsed) {
            archiveModule.classList.add('collapsed');
        } else {
            archiveModule.classList.remove('collapsed');
        }
        
        // 新增：更新有序模式UI
        updateOrderModeUI();
        
        // 更新界面
        placeDivider();
        updateCardTypes();
        updateDetailsPanel();
        
        // 更新统计信息
        updateStatistics();
        
        // 新增：延迟恢复选中的卡片
        setTimeout(() => {
            restoreSelectedCardFromStorage();
        }, 50);
    }

    // 新增：从 localStorage 恢复选中卡片的函数
    function restoreSelectedCardFromStorage() {
        if (!currentWorkspaceId) return;
        
        const storageKey = `selectedCard_${currentWorkspaceId}`;
        const savedCardTitle = localStorage.getItem(storageKey);
        
        if (savedCardTitle) {
            // 查找匹配的卡片（所有卡片中第一个标题匹配的）
            const allCards = Array.from(document.querySelectorAll('.card-list .card, .archive-content .card'));
            
            for (const card of allCards) {
                const cardTitle = card.dataset.fullContent || card.querySelector('.card-title').textContent;
                
                // 简单匹配：如果保存的标题与卡片标题开头部分匹配（考虑到标题可能被截断）
                if (cardTitle.startsWith(savedCardTitle) || savedCardTitle.startsWith(cardTitle)) {
                    selectCard(card);
                    return;
                }
            }
            
            console.log('未找到匹配的卡片，将选中第一个卡片');
        }
        
        // 如果没有保存的选中卡片或没找到匹配的，选中第一个卡片（如果存在）
        const firstCard = document.querySelector('.card-list .card') || document.querySelector('.archive-content .card');
        if (firstCard) {
            selectCard(firstCard);
        }
    }

    // 加载工作区数据
    async function loadWorkspaceData() {
        console.log('--- loadWorkspaceData: 开始加载工作区数据 ---');
        
        try {
            const data = await loadFromServer();
            
            if (data && !data.error) {
                // 成功从服务器加载数据
                workspaces = data.workspaces || {};
                currentWorkspaceId = data.currentWorkspaceId;
                
                console.log('--- loadWorkspaceData: 从服务器加载的工作区数据 ---', data);
                
                // 新增：确保所有工作区都有 isOrdered 属性
                Object.values(workspaces).forEach(workspace => {
                    if (workspace.isOrdered === undefined) {
                        workspace.isOrdered = true; // 为旧数据设置默认值
                    }
                });
            } else {
                // 数据文件不存在或为空，创建默认工作区
                console.log('--- loadWorkspaceData: 数据文件不存在或为空，创建默认工作区 ---');
                createDefaultWorkspace();
                await saveWorkspaceData();
            }
            
            // 确保至少有一个工作区
            if (Object.keys(workspaces).length === 0) {
                createDefaultWorkspace();
                await saveWorkspaceData();
            }
            
            // 确保当前工作区有效
            if (!currentWorkspaceId || !workspaces[currentWorkspaceId]) {
                currentWorkspaceId = Object.keys(workspaces)[0];
            }
            
            // 更新工作区选择器
            updateWorkspaceSelector();
            
            // 加载当前工作区状态
            loadCurrentWorkspaceState();
            
            console.log('--- loadWorkspaceData: 工作区数据加载完成 ---');
        } catch (error) {
            console.error('--- loadWorkspaceData: 工作区数据加载失败！---', error);
            createDefaultWorkspace();
            await saveWorkspaceData();
        }
    }

    // 简单的两日缓存备份函数
    async function simpleBackupCache(data) {
        try {
            // 生成日期相关的键名
            const todayKey = 'backup_today';
            const yesterdayKey = 'backup_yesterday';
            
            // 获取今天的日期字符串（格式：YYYY-MM-DD）
            const today = new Date().toISOString().split('T')[0];
            
            // 检查今天是否已经备份过
            const todayCache = localStorage.getItem(todayKey);
            if (todayCache) {
                try {
                    const todayData = JSON.parse(todayCache);
                    // 检查缓存时间是否是今天
                    if (todayData.timestamp && todayData.timestamp.startsWith(today)) {
                        console.log('今天已经备份过，跳过保存');
                        return; // 今天已经备份过，不再保存
                    }
                } catch (e) {
                    console.warn('解析今日缓存失败，重新保存', e);
                }
            }
            
            // 如果不是今天的数据，或者没有缓存，执行备份逻辑
            
            // 1. 如果今天有旧数据，先移动到昨天的键
            if (todayCache) {
                localStorage.setItem(yesterdayKey, todayCache);
                console.log('将旧的今日数据移动到昨天的键');
            }
            
            // 2. 保存新数据到今天的键
            const backupData = {
                data: data, // 原始数据
                timestamp: new Date().toISOString(), // 完整时间戳
                date: today, // 日期部分
                backupTime: Date.now() // 备份时间戳
            };
            
            localStorage.setItem(todayKey, JSON.stringify(backupData));
            console.log('数据已备份到本地缓存（今日键）');
            
            // 3. 可选：清理超过两天的数据（保留只今天和昨天）
            const allKeys = Object.keys(localStorage);
            allKeys.forEach(key => {
                if (key.startsWith('backup_') && key !== todayKey && key !== yesterdayKey) {
                    localStorage.removeItem(key);
                    console.log(`清理旧缓存键: ${key}`);
                }
            });
            
        } catch (error) {
            console.error('备份缓存失败:', error);
            // 静默失败，不影响主流程
        }
    }


    // 保存工作区数据
    async function saveWorkspaceData() {
        console.log('--- saveWorkspaceData: 开始保存工作区数据 ---');
        
        // 保存当前工作区状态
        if (currentWorkspaceId) {
            saveCurrentWorkspaceState();
        }
        
        const dataToSave = {
            workspaces: workspaces,
            currentWorkspaceId: currentWorkspaceId
        };
        
        console.log('--- saveWorkspaceData: 准备保存的数据 ---', dataToSave);
        
        try {
            await saveToServer(dataToSave);
            console.log('--- saveWorkspaceData: 工作区数据保存成功 ---');
            await simpleBackupCache(dataToSave);
        } catch (error) {
            console.error('--- saveWorkspaceData: 工作区数据保存失败！---', error);
            console.log('保存数据失败，请检查网络连接！');
            console.log('原始数据:', dataToSave);
        }
    }

            placeholder.innerHTML = `<div class="card-content">拖放到此处</div>`;
        }
        placeholder.classList.remove('restore-placeholder'); // 确保没有还原样式
        placeholder.style.width = `${width}px`;
        placeholder.style.height = `${height}px`;

        if (summaryElement) {
            // 清除旧的HTML标签，提取纯文本

    // 创建新卡片
    function createNewCard(content = '新事项', details = '', tagColor = '#ff9800', isArchived = false, originalTagColor = '') { // 新增 originalTagColor 参数
        const newCard = document.createElement('div');
        newCard.classList.add('card');

        // --- 修改: 从 data-full-content 获取完整文本 ---
        let displayContent = content;
        if (content.length > TITLE_MAX_LENGTH) {
            displayContent = content.substring(0, TITLE_MAX_LENGTH) + '...';
        }

        // 如果 originalTagColor 未定义，则使用 tagColor 作为原始颜色
        const finalOriginalTagColor = originalTagColor || tagColor;
        newCard.dataset.originalTagColor = finalOriginalTagColor; // 使用 data 属性存储原始颜色
        newCard.dataset.details = details; // 使用 data 存储详细信息
        newCard.dataset.fullContent = content; // 新增：保存完整标题内容

        // 提取摘要
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = details;
        const summaryText = tempDiv.textContent || '';
        const displaySummary = summaryText.substring(0, SUMMARY_MAX_LENGTH) + (summaryText.length > SUMMARY_MAX_LENGTH ? '...' : '');

        // 构建内部HTML，新增 card-type 和 card-summary
        let cardContentHTML = `

                            <div class="card-content">

                                    <p class="card-summary">${displaySummary}</p>
                                    <p class="card-type"></p>
                                </div>
                            </div>

    // 双击事件处理函数 (卡片内容编辑)
    function handleDoubleClick(e) {
        const cardContent = e.currentTarget;
        const card = cardContent.closest('.card');
        const clickedElement = e.target;

        if (card.closest('.archive-module')) {
            return;
        }

        // 确保双击的是 card-title
        const h2 = clickedElement.closest('.card-title');
        if (!h2) return;

        if (isEditing || isDragging || isColorPicking) {
            return;
        }

        isEditing = true;

        // --- 修改: 从 data-full-content 获取完整文本 ---
        const fullText = card.dataset.fullContent || h2.textContent;
        const textarea = document.createElement('textarea');
        textarea.className = 'card-title-textarea'; // 使用新定义的类
        textarea.value = fullText;
        textarea.placeholder = '输入事项内容';
        textarea.rows = 1;

        h2.parentNode.replaceChild(textarea, h2);
        textarea.focus();
        textarea.select();

        function adjustTextareaHeight() {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        adjustTextareaHeight();
        textarea.addEventListener('input', adjustTextareaHeight);

        // 阻止事件冒泡到父级卡片，防止触发 mousedown 拖拽事件
        textarea.addEventListener('mousedown', (event) => {
            event.stopPropagation();
        });
        textarea.addEventListener('mouseup', (event) => {
            event.stopPropagation();
        });
        textarea.addEventListener('mousemove', (event) => {
            event.stopPropagation();
        });


        const saveEdit = () => {
            // 在保存前移除事件监听器，避免重复调用
            textarea.removeEventListener('blur', saveEdit);
            textarea.removeEventListener('keydown', handleKeydown);

            if (textarea.parentNode) {
                let newText = textarea.value.trim();
                if (newText === '') {
                    newText = '无标题事项';
                }

                // --- 新增: 保存完整内容并限制显示内容 ---
                card.dataset.fullContent = newText;
                if (newText.length > TITLE_MAX_LENGTH) {
                    h2.textContent = newText.substring(0, TITLE_MAX_LENGTH) + '...';
                } else {
                    h2.textContent = newText;
                }

                textarea.parentNode.replaceChild(h2, textarea);
                isEditing = false;
                textarea.removeEventListener('input', adjustTextareaHeight);
                saveWorkspaceData(); // 编辑后保存数据
                updateDetailsPanel(); // 更新详细信息面板标题
            }
        };

        // --- 核心修复：按下回车键时直接保存并退出编辑 ---
        const handleKeydown = (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); // 阻止默认的换行行为
                saveEdit(); // 直接调用保存函数
            }
        };

        textarea.addEventListener('blur', saveEdit);
        textarea.addEventListener('keydown', handleKeydown);
    }

    // 双击事件处理函数 (标签头颜色修改)
    function handleTagDoubleClick(e) {
        const cardTag = e.currentTarget;
        const card = cardTag.closest('.card');

        if (card.closest('.archive-module')) {
            return;
        }

        e.stopPropagation();

        if (isEditing || isDragging) {
            return;
        }

        isColorPicking = true;

        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.style.position = 'fixed';

        let posX = e.clientX;
        let posY = e.clientY;

        if (posX + 200 > window.innerWidth) {
            posX = window.innerWidth - 200;
        }
        if (posY + 30 > window.innerHeight) {
            posY = window.innerHeight - 30;
        }
        if (posX < 0) posX = 0;
        if (posY < 0) posY = 0;

        colorInput.style.left = `${posX}px`;
        colorInput.style.top = `${posY}px`;
        colorInput.style.opacity = '0';
        colorInput.style.pointerEvents = 'none';
        colorInput.style.zIndex = '9999';

        colorInput.value = rgbToHex(cardTag.style.backgroundColor) || '#ff9800';

        document.body.appendChild(colorInput);

        setTimeout(() => {
            colorInput.style.pointerEvents = 'auto';
            colorInput.click();

            cardTag.style.backgroundColor = event.target.value;

            saveWorkspaceData(); // 颜色修改后保存数据
        });

        colorInput.addEventListener('change', () => {
            if (document.body.contains(colorInput)) {
                document.body.removeChild(colorInput);
                isColorPicking = false;
            }
        });
        colorInput.addEventListener('blur', () => {

            }

    // 辅助函数：RGB颜色转HEX颜色 (用于兼容获取到的 background-color)
    function rgbToHex(rgb) {
        if (rgb.startsWith('#')) return rgb;
        const parts = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
        if (!parts) return '';

        function toHex(c) {
            const hex = parseInt(c).toString(16);
            return hex.length === 1 ? "0" + hex : hex;
        }
        return "#" + toHex(parts[1]) + toHex(parts[2]) + toHex(parts[3]);
    }

    cardList.addEventListener('mousedown', (e) => {
        if (e.button !== 0) {
            return;
        }

        const target = e.target.closest('.card');
        const clickedTag = e.target.closest('.card-tag');
        const clickedTextarea = e.target.tagName.toLowerCase() === 'textarea';
        const clickedDeleteButton = e.target.closest('.delete-button'); // 新增：判断是否点击了删除按钮
        const clickedContentEditable = e.target.closest('[contenteditable="true"]'); // 新增：判断是否点击了 contenteditable 区域

        // 如果点击的是卡片，但点击的是标签、文本编辑区、删除按钮或 contenteditable 区域，则不触发拖拽
        if (!target || target.closest('.archive-module') || clickedTag || clickedTextarea || clickedDeleteButton || clickedContentEditable) {
            return;
        }

        if (isEditing || isColorPicking) {
            e.preventDefault();
            e.stopPropagation();
            return;
        }

        const targetCard = target;
        if (targetCard) {
            e.preventDefault();

            if (e.target.draggable) {
                e.target.draggable = false;
            }

            draggedItem = targetCard;
            isDragging = false;

            initialMouseX = e.clientX;
            initialMouseY = e.clientY;

            originalItemRect = draggedItem.getBoundingClientRect();

            const mainCards = Array.from(cardList.children).filter(child => child.classList.contains('card'));
            const originalIndex = mainCards.indexOf(draggedItem);
            draggedItem.dataset.originalIndex = originalIndex;

            originalNextSibling = draggedItem.nextSibling;

            document.documentElement.style.setProperty('--drag-width', `${originalItemRect.width}px`);
            document.documentElement.style.setProperty('--drag-height', `${originalItemRect.height}px`);
            document.documentElement.style.setProperty('--drag-start-x', `${originalItemRect.left}px`);
            document.documentElement.style.setProperty('--drag-start-y', `${originalItemRect.top}px`);

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }
    });

    // 鼠标移动事件
    function onMouseMove(e) {
        if (!draggedItem) return;

        const currentMouseOffsetX = e.clientX - initialMouseX;
        const currentMouseOffsetY = e.clientY - initialMouseY;

        if (!isDragging && (Math.abs(currentMouseOffsetX) > 5 || Math.abs(currentMouseOffsetY) > 5)) {
            isDragging = true;
            draggedItem.classList.add('is-dragging');
            removeAllPlaceholders();
            const { width, height } = getStandardCardDimensions();
            createPlaceholder(width, height);
            cardList.insertBefore(placeholder, draggedItem);
            captureFirstState();
            animateCardsFLIP();
        }

        if (isDragging) {
            const newX = currentMouseOffsetX;
            const newY = currentMouseOffsetY;
            document.documentElement.style.setProperty('--x', `${newX}px`);
            document.documentElement.style.setProperty('--y', `${newY}px`);
            updatePlaceholderPosition(e.clientX, e.clientY);
        }
    }

    // 捕获所有非拖拽元素的 First State
    function captureFirstState() {
        Array.from(cardList.children).forEach(child => {
            if (child !== draggedItem && child !== placeholder && child !== restorePlaceholder && !child.classList.contains('card-divider')) {
                child._initialRect = child.getBoundingClientRect();
            }
        });
    }

    // 更新占位符位置的逻辑
    function updatePlaceholderPosition(mouseX, mouseY) {
        const currentChildren = Array.from(cardList.children).filter(child => child !== draggedItem && child !== restorePlaceholder && child !== placeholder && !child.classList.contains('card-divider'));

        let newPlaceholderIndex = currentChildren.length;

        for (let i = 0; i < currentChildren.length; i++) {
            const item = currentChildren[i];
            if (item === placeholder) continue;

            const rect = item.getBoundingClientRect();
            const itemCenterY = rect.top + rect.height / 2;

            if (mouseY < itemCenterY) {
                newPlaceholderIndex = i;
                break;
            }
        }

        if (newPlaceholderIndex !== currentPlaceholderIndex) {
            captureFirstState();
            currentPlaceholderIndex = newPlaceholderIndex;

            if (newPlaceholderIndex === currentChildren.length) {
                cardList.appendChild(placeholder);
            } else {
                const targetElement = currentChildren[newPlaceholderIndex];
                if (targetElement && cardList.contains(targetElement)) {
                    cardList.insertBefore(placeholder, targetElement);
                } else {
                    cardList.appendChild(placeholder);
                }
            }

            animateCardsFLIP();
        }
    }

    // 核心动画逻辑：FLIP
    function animateCardsFLIP() {
        const allItems = Array.from(cardList.children);

        allItems.forEach(item => {
            if (item === draggedItem || item === placeholder || item === restorePlaceholder || item.classList.contains('card-divider')) return;

            const firstRect = item._initialRect;
            const lastRect = item.getBoundingClientRect();

            if (!firstRect || (firstRect.left === lastRect.left && firstRect.top === lastRect.top)) {
                item.style.transform = '';
                item.style.transition = '';
                return;
            }

            const deltaX = firstRect.left - lastRect.left;
            const deltaY = firstRect.top - lastRect.top;

            item.style.transition = 'none';
            item.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

            item.offsetWidth;

            item.style.transition = 'transform 0.2s ease-out';
            item.style.transform = '';
        });
    }

    // 鼠标抬起事件
    function onMouseUp() {
        if (draggedItem && isDragging) {
            if (placeholder && placeholder.parentNode) {
                cardList.insertBefore(draggedItem, placeholder);
                removeAllPlaceholders(); // 统一移除所有占位符
            } else {
                // 如果没有占位符，将其放回原始位置
                cardList.insertBefore(draggedItem, originalNextSibling);
            }

            draggedItem.classList.remove('is-dragging');
            draggedItem = null;
            isDragging = false;
            originalNextSibling = null;
            originalItemRect = null;
            currentPlaceholderIndex = -1;

            document.documentElement.style.removeProperty('--x');
            document.documentElement.style.removeProperty('--y');
            document.documentElement.style.removeProperty('--drag-width');
            document.documentElement.style.removeProperty('--drag-height');
            document.documentElement.style.removeProperty('--drag-start-x');
            document.documentElement.style.removeProperty('--drag-start-y');

            Array.from(cardList.children).forEach(child => {
                child.style.transition = '';
                child.style.transform = '';
                delete child._initialRect;
            });

            placeDivider(); // 拖拽结束后，重新放置分割线
            updateCardTypes(); // 拖拽后更新卡片类型
            saveWorkspaceData(); // 拖拽完成后保存数据

        } else if (draggedItem && !isDragging) {
            // 单击卡片时的选中逻辑已经交给统一的点击事件处理
        }

        draggedItem = null;
        originalNextSibling = null;
        originalItemRect = null;

        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
    }

    //将指定的卡片从主列表移动到归档区，并更新其样式和事件。
    function archiveCard(cardToArchive) {
        // 1. 核心判断：确保卡片存在，并且在主列表中，并且是主列表中的第一张卡片
        if (!cardToArchive) {
            console.error('错误：尝试归档一个不存在的卡片。');
            return;
        }

        if (cardToArchive.closest('.archive-module')) {
            // 使用 .closest() 判断卡片是否已经在归档区
            console.warn('警告：该卡片已在归档区，无法重复归档。');
            return;
        }

        // 新增：检查有序模式限制
        const currentWorkspace = workspaces[currentWorkspaceId];
        if (currentWorkspace.isOrdered) {
            // 有序模式：只有第一个任务可以完成
            const firstCard = cardList.querySelector('.card');
            if (cardToArchive !== firstCard) {
                alert('有序任务工作区无法提前完成非第一个任务！');
                return;
            }
        }

        // 检查卡片是否在主列表，并且是第一个（在有序模式下）
        // 对于无序模式，任何卡片都可以归档
        if (!cardList.contains(cardToArchive)) {
            console.warn('警告：该卡片不在主列表中，无法归档。');
            return;
        }

        // 从这里开始，代码和之前一样，执行实际的归档操作
        const wasSelected = selectedCard === cardToArchive;

        cardList.removeChild(cardToArchive);
        removeAllDividers();

        cardToArchive.style.cssText = '';
        cardToArchive.classList.remove('is-dragging', 'selected');
        cardToArchive.removeAttribute('title');
        cardToArchive.style.borderLeftColor = '';

        const cardContentElement = cardToArchive.querySelector('.card-content');
        if (cardContentElement) {
            cardContentElement.removeEventListener('dblclick', handleDoubleClick);
        }
        const cardTagElement = cardToArchive.querySelector('.card-tag');
        if (cardTagElement) {
            cardTagElement.removeEventListener('dblclick', handleTagDoubleClick);
        }

        const existingDeleteButton = cardToArchive.querySelector('.delete-button');
        if (existingDeleteButton) {
            existingDeleteButton.removeEventListener('click', handleDeleteClick);
            cardToArchive.removeChild(existingDeleteButton);
        }

        if (cardTagElement) {
            cardTagElement.style.backgroundColor = '#888';
            cardTagElement.style.cursor = 'default';
        }

        const restoreButton = document.createElement('button');
        restoreButton.classList.add('restore-button');
        restoreButton.setAttribute('title', '恢复到主列表');
        restoreButton.innerHTML = '&#8635;';
        cardToArchive.appendChild(restoreButton);

        const typeElement = cardToArchive.querySelector('.card-type');
        if (typeElement) typeElement.style.display = 'none';

        archiveContent.appendChild(cardToArchive);
        archiveModule.classList.remove('collapsed');

        placeDivider();
        updateCardTypes();
        saveWorkspaceData();
        
        // 更新统计信息
        updateStatistics();

        if (wasSelected) {
            const firstCardAfterArchive = cardList.querySelector('.card');
            if (firstCardAfterArchive) {
                selectCard(firstCardAfterArchive);
            } else {
                selectedCard = null;
                updateDetailsPanel();
            }
        }
    }

                    newCardContent.addEventListener('dblclick', handleDoubleClick);
                }
                const newCardTag = clickedArchivedCard.querySelector('.card-tag');
                if (newCardTag) {
                    newCardTag.addEventListener('dblclick', handleTagDoubleClick);
                    newCardTag.style.cursor = 'pointer'; // 恢复可点击状态
                }
                // 恢复删除按钮 (作为 card 的直接子元素)
                const deleteButton = document.createElement('button');
                deleteButton.classList.add('delete-button');
                deleteButton.innerHTML = '&#10005;';
                deleteButton.setAttribute('title', '删除此事项');
                clickedArchivedCard.appendChild(deleteButton); // 将删除按钮添加到 card 内部
                deleteButton.addEventListener('click', handleDeleteClick);

                // 恢复时将卡片插入到第一个位置
                cardList.insertBefore(clickedArchivedCard, cardList.firstChild);

                clickedArchivedCard.style.opacity = '0';
                setTimeout(() => {
                    clickedArchivedCard.style.transition = 'opacity 0.3s ease-in-out, transform 0.2s ease-out';
                    clickedArchivedCard.style.opacity = '1';
                }, 0);

                placeDivider(); // 恢复后重新放置分割线
                updateCardTypes(); // 恢复后更新卡片类型文案
                saveWorkspaceData(); // 恢复后保存数据
                
                // 更新统计信息
                updateStatistics();

                // 自动选中恢复的卡片
                selectCard(clickedArchivedCard);
            }
        }
    });

    // 恢复按钮的鼠标悬停事件监听 (显示占位符)
    archiveContent.addEventListener('mouseenter', function (e) {
        const restoreButton = e.target.closest('.restore-button');
        if (restoreButton) {
            const archivedCard = restoreButton.closest('.card');
            if (archivedCard && !isDragging && !isEditing && !isColorPicking) {
                const { width, height } = getStandardCardDimensions();

                removeAllPlaceholders();

                createRestorePlaceholder(width, height);
                cardList.insertBefore(restorePlaceholder, cardList.firstChild);
            }
        }
    }, true);

    // 恢复按钮的鼠标移出事件监听 (移除占位符)
    archiveContent.addEventListener('mouseleave', function (e) {
        const relatedTarget = e.relatedTarget;
        if (e.target.closest('.restore-button') && (!relatedTarget || !e.target.closest('.restore-button').contains(relatedTarget))) {
            removeAllPlaceholders();
        }
    }, true);

    // 捕获阶段的 mouseout，更精确地处理从按钮移出
    archiveContent.addEventListener('mouseout', function (e) {
        const restoreButton = e.target.closest('.restore-button');
        if (restoreButton && !restoreButton.contains(e.relatedTarget)) {
            removeAllPlaceholders();
        }
    }, true);

    // --- 新增：核心删除逻辑函数 ---
    function deleteCard(card) {
        console.log("--- deleteCard: 尝试删除卡片 ---", card);
        if (!card) {
            console.warn("--- deleteCard: 传入的卡片为 null 或 undefined，无法删除。");
            return;
        }

        const parentList = card.parentNode;
        const wasSelected = selectedCard === card;

        parentList.removeChild(card);
        console.log("--- deleteCard: 卡片已从DOM中移除。");

        // 如果删除的是主列表的卡片，重新放置分割线
        if (parentList === cardList) {
            placeDivider();
            updateCardTypes(); // 删除后更新类型文案
            console.log("--- deleteCard: 已更新分割线和卡片类型。");
        }

        saveWorkspaceData(); // 删除卡片后保存数据
        
        // 更新统计信息
        updateStatistics();

        // 如果删除的是选中的卡片，则自动选中下一个卡片（如果存在）
        if (wasSelected) {
            const firstCardAfterDelete = cardList.querySelector('.card') || archiveContent.querySelector('.card');
            if (firstCardAfterDelete) {
                selectCard(firstCardAfterDelete);
                console.log("--- deleteCard: 已自动选中下一个卡片。");
            } else {
                // 如果所有列表都为空，则清空选中
                selectedCard = null;
                updateDetailsPanel();
                console.log("--- deleteCard: 所有卡片已删除，清空选中状态。");
            }
        }
        console.log("--- deleteCard: 删除操作完成。");
    }

    // --- 新增：辅助函数 _collectCurrentCardsData 来收集当前 DOM 中的卡片数据 ---
    function _collectCurrentCardsData() {
        const allCardsData = [];

        // 收集主列表中的卡片数据
        document.querySelectorAll('.card-list .card').forEach(card => {
            const content = card.dataset.fullContent || card.querySelector('.card-title').textContent;
            const tagColor = rgbToHex(card.querySelector('.card-tag').style.backgroundColor);
            const originalTagColor = card.dataset.originalTagColor || tagColor;
            const details = card.dataset.details || '';
            allCardsData.push({
                content: content,
                tagColor: tagColor || '#ff9800',
                isArchived: false,
                originalTagColor: originalTagColor,
                details: details
            });
        });

        // 收集归档列表中的卡片数据
        document.querySelectorAll('.archive-content .card').forEach(card => {
            const content = card.dataset.fullContent || card.querySelector('.card-title').textContent;
            const tagColor = rgbToHex(card.querySelector('.card-tag').style.backgroundColor);
            const originalTagColor = card.dataset.originalTagColor || tagColor;
            const details = card.dataset.details || '';
            allCardsData.push({
                content: content,
                tagColor: tagColor || '#888',
                isArchived: true,
                originalTagColor: originalTagColor,
                details: details
            });
        });
        console.log('--- _collectCurrentCardsData: 收集到的数据:', JSON.parse(JSON.stringify(allCardsData))); // Added log here
        return allCardsData;
    }

    // --- 详细信息内容区的 blur 事件处理，用于保存快照和数据 ---
    // 定义一个独立的函数，以便可以添加/移除监听器
    // --- 键盘事件监听器 ---
    document.addEventListener('keydown', (e) => {
        console.log('--- 键盘事件: 检测到按键。键:', e.key, 'Ctrl:', e.ctrlKey, 'Meta (Command):', e.metaKey, 'Target:', e.target.tagName.toLowerCase());

        // 检查当前焦点是否在可编辑元素上 (textarea 或 contenteditable div)
        const isTargetEditable = (
            e.target.tagName.toLowerCase() === 'textarea' ||
            (e.target.hasAttribute('contenteditable') && e.target.getAttribute('contenteditable') === 'true')
        );

        // Ctrl+S 阻止默认保存行为
        if (e.key.toUpperCase() === 'S' && (e.ctrlKey || e.metaKey)) { // e.key.toUpperCase() 解决大小写问题
            e.preventDefault(); // 阻止浏览器默认的撤销行为
            return; // 处理完撤销，直接返回
        }

        // 只有当焦点不在可编辑元素上，并且有选中的卡片时，才允许 Delete 键删除卡片
        if (!isTargetEditable && selectedCard && e.key === 'Delete') {
            e.preventDefault(); // 阻止浏览器默认的删除行为 (例如在某些输入框中的删除行为)
            console.log('--- 键盘事件: 接收到 Delete 键，并且不在编辑模式，执行卡片删除。');
            deleteCard(selectedCard);
        }
    });

    // --- 新增：更新统计信息函数 ---
    function updateStatistics() {
        // 计算未完成事项数量（主列表中的卡片）
        const uncompletedCards = document.querySelectorAll('.card-list .card');
        const uncompletedCount = uncompletedCards.length;
        
        // 计算已完成事项数量（归档模块中的卡片）
        const completedCards = document.querySelectorAll('.archive-content .card');
        const completedCount = completedCards.length;
        
        // 计算总事项数量
        const totalCount = uncompletedCount + completedCount;
        
        // 计算完成百分比（已完成事项占总事项的比例）
        let completedPercent = 0;
        if (totalCount > 0) {
            completedPercent = (completedCount / totalCount) * 100;
        }
        
        // 更新统计区域的显示
        completedPercentElement.textContent = `${completedPercent.toFixed(2)}%`;
        totalCountElement.textContent = totalCount;
        completedCountElement.textContent = completedCount;
        uncompletedCountElement.textContent = uncompletedCount;
        
        // 更新进度条（显示完成进度）
        progressBarFill.style.width = `${completedPercent}%`;
    }
